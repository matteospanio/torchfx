name: Test and lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  # Skip the validation jobs when an identical run already succeeded — e.g. the
  # push to `master` produced by merging a PR whose checks already passed. The
  # check is content-based (git tree), so it correctly still runs on a genuine
  # direct push to master, and on a merge whose result differs from what the PR
  # tested (out-of-date branch).
  pre_job:
    name: Skip duplicate runs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          skip_after_successful_duplicate: "true"
          concurrent_skipping: "never"

  prepare:
    name: Prepare (Python ${{ matrix.python-version }})
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Restore dependency cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-cpu-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Create project venv
        # uv 0.11+ requires .venv before `uv pip install` in project
        # context. We don't cache .venv (its python symlinks become
        # stale across runs as setup-python's toolcache rotates) so
        # always create a fresh one; the package cache at
        # ~/.cache/uv is what keeps reinstalls fast.
        run: uv venv

      - name: Install CPU-only PyTorch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies (builds C++ extension)
        run: TORCHFX_NO_CUDA=1 uv sync --all-groups

      - name: Save dependency cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/uv
          key: uv-cpu-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Check formatting with Black
        run: uvx black --check src tests

  ruff:
    name: Ruff (Python ${{ matrix.python-version }})
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Lint with Ruff
        run: |
          uvx ruff check src
          uvx ruff format --check src tests

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: [pre_job, prepare]
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-cpu-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Create project venv
        # uv 0.11+ requires .venv before `uv pip install` in project
        # context. We don't cache .venv (its python symlinks become
        # stale across runs as setup-python's toolcache rotates) so
        # always create a fresh one; the package cache at
        # ~/.cache/uv is what keeps reinstalls fast.
        run: uv venv

      - name: Install CPU-only PyTorch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies (builds C++ extension)
        run: TORCHFX_NO_CUDA=1 uv sync --all-groups

      - name: Run tests with pytest
        run: uv run pytest

  coverage:
    name: Coverage (Python 3.12)
    needs: [pre_job, prepare]
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-cpu-3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Create project venv
        # uv 0.11+ requires .venv before `uv pip install` in project
        # context. We don't cache .venv (its python symlinks become
        # stale across runs as setup-python's toolcache rotates) so
        # always create a fresh one; the package cache at
        # ~/.cache/uv is what keeps reinstalls fast.
        run: uv venv

      - name: Install CPU-only PyTorch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies (builds C++ extension)
        run: TORCHFX_NO_CUDA=1 uv sync --all-groups

      - name: Run tests under coverage
        run: uv run coverage run -m pytest

      - name: Report coverage (enforces fail_under)
        run: uv run coverage report -m

      - name: Generate HTML report
        if: always()
        run: uv run coverage html -d htmlcov

      - name: Upload HTML coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 14
